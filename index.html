<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小游戏</title>
    <link rel="stylesheet" href="./style.css">
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
</head>
<body>
  <div class="container">
      <h1 style="color: #ffffff;">选择对答案</h1>
  <input type="file" id="fileInput" accept=".xlsx,.xls" />

  <div id="game">
    <div class="info">
      总题数: <span id="totalQ"></span> | 分数: <span  id="score">0</span>
    </div>
    <h2 id="question"></h2>
    <div id="questionImage"></div> <!-- 🔹 ảnh minh họa sẽ hiển thị ở đây -->
    <div id="answers"></div>
    <button id="confirm">确认</button>
    <button id="next">下一句</button>
  </div>

  <!-- Popup kết quả -->
  <div id="popup">
    <div class="popup-content">
      <h2>结果</h2>
      <p id="finalScore"></p>
      <p id="comment"></p>
      <button id="replay">重新玩</button>
    </div>
  </div>

  <!-- Âm thanh -->
  <!-- <audio id="correctSound" src="https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg"></audio>
  <audio id="wrongSound" src="https://actions.google.com/sounds/v1/cartoon/boing.ogg"></audio> -->
  <audio id="correctSound" src="sounds/true.mp3" preload="auto"></audio>
<audio id="wrongSound" src="sounds/error.mp3" preload="auto"></audio>
<!-- <div class="coppyright">
  <img src="" alt="">
  <p>coppyright DongPham</p>
</div> -->
</div>
</body>
<script src="./index.js"></script>
</html>
